name: Daily puzzle + deploy

on:
  schedule:
    - cron: "0 5 * * *"        # 05:00 UTC = midnight CDT / 11pm CST
  workflow_dispatch:
    inputs:
      date:
        description: "Generate a specific date (YYYY-MM-DD). Leave blank to fill today..today+7."
        required: false
      force:
        description: "Regenerate even if the puzzle exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["README.md"]

permissions: {}   # nothing by default; each job asks only for what it needs

concurrency:
  group: analyst-eye
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # commit the new puzzles
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install --no-cache-dir -r generator/requirements.txt
      - name: Generate puzzles
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}   # optional; leave unset to use template notes
          IN_DATE: ${{ inputs.date }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$IN_DATE" ]; then
            [[ "$IN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "date must be YYYY-MM-DD"; exit 1; }
            if [ "$IN_FORCE" = "true" ]; then python generator/make_puzzle.py --date "$IN_DATE" --force
            else python generator/make_puzzle.py --date "$IN_DATE"; fi
          else
            python generator/make_puzzle.py
          fi
      - name: Commit
        run: |
          git config user.name "analyst-eye-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add puzzles generator/history.json p assets/cards
          git diff --cached --quiet && echo "no changes" || (git commit -m "Puzzles $(date -u +%F)" && git push)

  deploy:
    needs: [generate]
    if: always() && (needs.generate.result == 'success' || needs.generate.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write             # publish to GitHub Pages
      id-token: write          # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: { python-version: "3.12" }
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5.0.0
      - name: Write public URL into config + meta tags
        env:
          VAR_URL: ${{ vars.SITE_URL }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          URL="$VAR_URL"
          [ -z "$URL" ] && URL="$PAGES_URL/"
          python tools/set_site_url.py "$URL"
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html embed.html hidden.html config.js assets puzzles hidden p .nojekyll _site/
          rm -f _site/puzzles/*.json.bak
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3.0.1
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
